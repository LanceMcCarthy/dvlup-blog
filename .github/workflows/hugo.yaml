name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0

    steps:
      - name: Install Hugo CLI
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_extended_${HUGO_VERSION}_linux-amd64.deb$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dvlup/package-lock.json

      - name: Install Node.js dependencies
        working-directory: dvlup
        run: npm ci

      - name: Audit Node.js dependencies
        working-directory: dvlup
        run: npm audit

      - name: Build with Hugo
        run: |
          cd dvlup
          hugo \
            --gc \
            --minify \
            --baseURL "${{steps.pages.outputs.base_url}}/"
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dvlup/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1