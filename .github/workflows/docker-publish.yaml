name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  HUGO_VERSION: 0.168.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_extended_${HUGO_VERSION}_linux-amd64.deb$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive  # For Hugo themes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dvlup/package-lock.json

      - name: Install Node.js dependencies
        working-directory: dvlup
        run: npm ci

      - name: Audit Node.js dependencies
        working-directory: dvlup
        run: npm audit

      - name: Set site build timestamp
        run: echo "HUGO_SITE_BUILD_TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Build with Hugo
        run: |
          cd dvlup
          hugo --gc --minify
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

      - name: Upload built-site artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-site
          path: dvlup/public/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: dvlup/public/

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: ghcr.io/lancemccarthy/dvlup-blog:latest
          platforms: linux/amd64,linux/arm64

  update-production:
    needs: publish
    environment: production # has 1 minute wait timer, https://github.com/LanceMcCarthy/dvlup-blog/settings/environments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook to redeploy site
        run: curl --fail-with-body --show-error -X POST "${{secrets.PORTAINER_WEBHOOK_URL}}"